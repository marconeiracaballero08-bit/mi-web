<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="CRM personal: contactos, oportunidades de venta, tareas y seguimiento.">
  <title>Mi CRM</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%234f46e5'/><path d='M16 7l9 9-9 9-9-9z' fill='white'/></svg>">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="logo" aria-hidden="true"></span>
        <span id="brandName">Mi CRM</span>
      </div>
      <nav class="nav" aria-label="Secciones">
        <a href="#/panel" data-route="panel">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 13h8V3H3zm0 8h8v-6H3zm10 0h8V11h-8zm0-18v6h8V3z"/></svg>
          <span>Panel</span>
        </a>
        <a href="#/contactos" data-route="contactos">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 11a4 4 0 1 0-4-4 4 4 0 0 0 4 4zm-8 0a3 3 0 1 0-3-3 3 3 0 0 0 3 3zm0 2c-2.3 0-7 1.2-7 3.5V19h7v-2.5c0-.9.4-2.1 1.7-3.1A10 10 0 0 0 8 13zm8 0c-2.7 0-8 1.3-8 4v2h16v-2c0-2.7-5.3-4-8-4z"/></svg>
          <span>Contactos</span>
        </a>
        <a href="#/oportunidades" data-route="oportunidades">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h4v16H3zm7 0h4v11h-4zm7 0h4v7h-4z"/></svg>
          <span>Oportunidades</span>
        </a>
        <a href="#/tareas" data-route="tareas">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>
          <span>Tareas</span>
        </a>
        <a href="#/ajustes" data-route="ajustes">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.4-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3.3h-4l-.4 2.7a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.4L6.6 11a7.5 7.5 0 0 0 0 2l-2.1 1.6 2 3.4 2.5-1a7.4 7.4 0 0 0 1.7 1l.4 2.7h4l.4-2.7a7.4 7.4 0 0 0 1.7-1l2.5 1 2-3.4zM13 15.5A3.5 3.5 0 1 1 16.5 12 3.5 3.5 0 0 1 13 15.5z" transform="translate(-1 0)"/></svg>
          <span>Ajustes</span>
        </a>
      </nav>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 14h-.8l-.3-.3A6.5 6.5 0 1 0 14 15.5l.3.3v.8l5 5 1.5-1.5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
          <input id="globalSearch" type="search" placeholder="Buscar contactos, empresas u oportunidades…" autocomplete="off" aria-label="Buscar">
          <div id="searchResults" class="search-results" hidden></div>
        </div>
        <button class="icon-btn" id="themeToggle" type="button" title="Cambiar tema" aria-label="Cambiar tema">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9A9 9 0 0 0 12 3zm0 16V5a7 7 0 0 1 0 14z"/></svg>
        </button>
      </header>
      <section id="view" class="view" tabindex="-1"></section>
    </main>
  </div>

  <dialog id="modal" class="modal"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <input type="file" id="importFile" accept="application/json,.json" hidden>

  <script src="app.js"></script>
</body>
</html>
